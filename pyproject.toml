[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "smoke.py"]
markers = [
    "smoke: fast smoke coverage for CLI, dataset generation, checkpoint loading, and inference",
]

[tool.ruff]
target-version = "py39"
src = ["core", "tests"]
extend-exclude = [".glyph", ".venv"]
